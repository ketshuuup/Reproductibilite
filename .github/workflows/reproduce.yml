name: Reproduce answers

on: push

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tp1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t rep-lab2 .

      - name: Run container
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$(pwd)":/out rep-lab2

      - name: Show answers
        run: cat answer_associativity.txt answer_banking.txt

      - name: Commit and push answers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add answer_associativity.txt answer_banking.txt
          if git diff --cached --quiet; then
            echo "Answers unchanged, nothing to commit"
          else
            git commit -m "Update answers (GitHub Actions)"
            git push
          fi
